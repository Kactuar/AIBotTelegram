name: Quality and production release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: aibot-production
  cancel-in-progress: false

jobs:
  quality:
    name: Verify commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run verify
      - run: npm run build

  deploy:
    name: Deploy verified commit
    if: github.event_name == 'push' && vars.AIBOT_DEPLOY_ENABLED == 'true'
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure pinned SSH host key
        shell: bash
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hetzner_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/hetzner_key ~/.ssh/known_hosts

      - name: Deploy the verified SHA
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hetzner_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$HETZNER_USER@$HETZNER_HOST" \
            "bash /srv/aibot/current/deploy/deploy-prod.sh '$COMMIT_SHA'"
