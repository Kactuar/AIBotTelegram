name: Quality and production release

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: aibot-production
  cancel-in-progress: false

jobs:
  quality:
    name: Verify commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run verify
      # Next imports the webhook route while collecting route metadata. The bot
      # is constructed during that import, so CI needs a syntactically valid
      # placeholder. Production builds still read the real value from
      # /srv/aibot/.env through .env.local on the server.
      - run: npm run build
        env:
          BOT_TOKEN: ci-build-placeholder

  deploy:
    name: Deploy verified commit
    if: github.event_name == 'push' && vars.AIBOT_DEPLOY_ENABLED == 'true'
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure pinned SSH host key
        shell: bash
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/hetzner_key
          # A server host key is public by design. Keeping it here pins this
          # workflow to the Hetzner host and makes an unexpected key fail closed.
          printf '%s\n' '95.216.200.181 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFIu8Miij6NJDncq+VKHWtzXmQ5accrKEiN0rRJXHqkL' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/hetzner_key ~/.ssh/known_hosts

      - name: Deploy the verified SHA
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/hetzner_key \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            deploy@95.216.200.181 \
            "bash /srv/aibot/current/deploy/deploy-prod.sh '$COMMIT_SHA'"
